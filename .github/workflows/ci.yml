name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy,rustfmt
      - run: cargo +1.98.0 fmt --check
      - run: cargo +1.98.0 clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo +1.98.0 test --locked --all-targets --all-features
      - run: cargo +1.98.0 build --locked --release --bin aiopd --bin aiop-mcp
